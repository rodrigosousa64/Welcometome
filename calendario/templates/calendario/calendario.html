{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'calendario/css/calendar-section.css' %}?v=3.5">
    <style>
        .calendario-page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 80vh;
        }
        .page-header {
            margin-bottom: 2rem;
            text-align: center;
        }
        .page-header h1 {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-family: 'Space Grotesk', sans-serif;
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
{% endblock %}

{% block content %}
<div class="calendario-page-container">
    <div class="page-header">
        <h1>Planejamento Estratégico</h1>
        <p>Acompanhamento do Calendário de 12 Semanas</p>
    </div>
    
    <section id="Metas12Semanas" class="ofensivas-wrapper">
        {% include 'calendario/partials/calendar-section.html' %}
    </section>
</div>

<script src="{% static 'calendario/js/calendar-section.js' %}?v=3.5"></script>
{% endblock %}
